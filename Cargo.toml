[package]
name = "bevy-td-sandbox"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", features = ["2d"] }
bevy_northstar = "0.6"
rand = "0.9"

# Enable max optimizations for dependencies, but not for our code
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
