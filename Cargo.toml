[package]
name = "bevy-td-sandbox"
version = "0.5.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d", "ui", "bevy_audio", "wav"] }
bevy_northstar = "0.8"
rand = "0.10"
# Tuning data files (src/tuning.rs). Bevy already depends on both.
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# getrandom 0.3 (pulled in by rand) needs the wasm_js backend on WASM.
# You must also pass `--cfg getrandom_backend="wasm_js"` in RUSTFLAGS for web builds.
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["native"]
native = [
    "dev",
    "bevy/file_watcher",
    "bevy/embedded_watcher",
]
# Dev mode (`src/dev/`). A plain `cargo build --release` keeps the default
# features, so it includes dev mode: build a release with
# `--no-default-features`, or with `bevy build --release`.
dev = [
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
]
dynamic = ["bevy/dynamic_linking"]

[package.metadata.bevy_cli.release]
default-features = false

[package.metadata.bevy_cli.web]
default-features = false

[package.metadata.bevy_cli.web.dev]
features = ["dev"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# Enable max optimizations for dependencies, but not for our code
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Used automatically by `bevy build --release web`.
[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
