[package]
name = "bevy-td-sandbox"
version = "0.4.0"
edition = "2024"

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["2d", "bevy_audio", "wav"] }
bevy_northstar = "0.6"
rand = "0.10"

# getrandom 0.3 (pulled in by rand) needs the wasm_js backend on WASM.
# You must also pass `--cfg getrandom_backend="wasm_js"` in RUSTFLAGS for web builds.
[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["native"]
native = [
    "web",
    "bevy/file_watcher",
    "bevy/embedded_watcher",
]
web = [
    "bevy/bevy_dev_tools",
    "bevy/bevy_ui_debug",
    "bevy/track_location",
]
dynamic = ["bevy/dynamic_linking"]

[package.metadata.bevy_cli.release]
default-features = false

[package.metadata.bevy_cli.web]
default-features = false

[package.metadata.bevy_cli.web.dev]
features = ["web"]

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

# Enable max optimizations for dependencies, but not for our code
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Used automatically by `bevy build --release web`.
[profile.web-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"
